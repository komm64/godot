name: komm64 Windows Build

# komm64 fork 専用の Windows build workflow (MSVC).
# editor は毎回、export template (template_debug / template_release) は
# tag push と workflow_dispatch のときだけビルドする。fork 専用 API を使う
# game は公式 template では動かないので、Release に template も添付する。
# __FILE__ に入るビルド機のパスは /d1trimfile で削り、配布物に絶対パスが
# 残っていないことを gate で確認する (#54)。
# その他の build flag (D3D12 / ANGLE / WinRT / AccessKit) は公式と同等にして、
# 後で「dev binary と production binary で挙動差があった」debug 困難を避ける。
#
# Trigger:
#   - workflow_dispatch: 手動 trigger (ad-hoc 検証用)
#   - tag push (v*-komm64*, except v*-komm64-webgpu*): 自動 build + Release 作成
#   - 4.6 push (= 通常 PR merge): build + cache populate (Release は作らない)
#   - komm64/** branch push: feature branch 検証用 build
#   - 4.6-webgpu は WebGPU web template workflow 側で扱う
#
# 4.6 を trigger に含めるのは godot-cache-restore が default_branch (= 4.6)
# の cache を fallback key として使うため。 4.6 を build しないと cache が
# 一度も save されず、 全 cycle が cache miss で fully clean build (~50 min)
# になる。 merge 後に 4.6 build を 1 回走らせて cache を populate しておくと、
# 以降の branch CI / tag build が default_branch fallback で hit して数分。
#
# Output:
#   - artifact: komm64-godot-windows-<target> (60-day retention)
#   - tag push 時のみ: GitHub Release に editor exe と template を添付。
#     template は export_templates/<version>/ にそのまま置ける名前
#     (windows_{debug,release}_x86_64[_console].exe)

on:
  workflow_dispatch:
  push:
    branches:
      - '4.6'
      - 'komm64/**'
    tags:
      - 'v*-komm64*'
      - '!v*-komm64-webgpu*'

# softprops/action-gh-release@v2 needs contents:write to create the release.
# Default GITHUB_TOKEN permission (contents:read) caused 403 on the first
# tag-trigger run (run #25262508341).
permissions:
  contents: write

env:
  # /d1trimfile strips the checkout path from __FILE__ (error macros), so
  # shipped binaries do not carry build-machine paths (#54).
  SCONS_FLAGS: >-
    module_text_server_fb_enabled=yes
    debug_symbols=no
    "ccflags=/d1trimfile:${GITHUB_WORKSPACE}\\"
    "angle_libs=${{ github.workspace }}/"
    "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.21.2/"
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Templates only for releases (tag push) and manual runs.
        target: ${{ fromJSON((github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) && '["editor","template_debug","template_release"]' || '["editor"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Restore build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: komm64-windows-${{ matrix.target }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      # SDK download steps mirror the official windows_builds.yml. ANGLE and
      # AccessKit are required (a failed download fails the build), so shipped
      # templates never silently lose them.

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download WinRT components
        shell: sh
        run: python ./misc/scripts/install_winrt.py
        continue-on-error: true

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-accesskit-c-static
          version: tags/0.21.2
          file: accesskit-c-0.21.2.zip
          target: accesskit-c-0.21.2/accesskit_c.zip

      - name: Extract pre-built AccessKit
        shell: bash
        run: unzip -o accesskit-c-0.21.2/accesskit_c.zip

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} production=${{ matrix.target == 'template_release' && 'yes' || 'no' }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: komm64-windows-${{ matrix.target }}
        continue-on-error: true

      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          mkdir -p out
          case "${{ matrix.target }}" in
            editor)
              cp bin/godot.windows.editor.x86_64.exe out/ ;;
            template_*)
              kind="${{ matrix.target }}"; kind="${kind#template_}"
              cp "bin/godot.windows.${{ matrix.target }}.x86_64.exe" "out/windows_${kind}_x86_64.exe"
              cp "bin/godot.windows.${{ matrix.target }}.x86_64.console.exe" "out/windows_${kind}_x86_64_console.exe" ;;
          esac
          ls -l out

      - name: Build path gate
        shell: python
        run: |
          # Fail if any binary embeds an absolute source path, e.g. from
          # __FILE__ in error macros (#54): X:\...\foo.h or X:/.../foo.cpp.
          # Upstream's prebuilt godot-nir-static carries its own public CI path
          # (same in official binaries), so it is not a leak of this machine.
          import glob, re, sys
          pattern = re.compile(rb"(?<![A-Za-z])[A-Za-z]:[\\/][^\x00\n]{0,160}?\.(?:h|hpp|c|cpp|inc)\b")
          hits = 0
          for f in sorted(glob.glob("out/*.exe")):
              found = [s for s in pattern.findall(open(f, "rb").read()) if b"godot-nir-static" not in s]
              print(f"{f}: {len(found)} build-path strings")
              for s in found[:5]:
                  print("   ", s.decode(errors="replace"))
              hits += len(found)
          if hits:
              print("::error::build machine paths found in binaries (#54)")
              sys.exit(1)

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: komm64-godot-windows-${{ matrix.target }}
          path: out/*

      # Headless smoke gate for komm64 fork-specific render_modes / features.
      # Catches the class of bug fixed in #26 — a parser whitelist out of sync
      # with backend render_mode_values mappings. Each new komm64 render_mode
      # / shader feature should add a line under the test_shader.gdshader.
      - name: Shader compile gate
        if: matrix.target == 'editor'
        shell: bash
        run: |
          set -e
          mkdir -p shader_gate_test
          cat > shader_gate_test/project.godot <<'EOF'
          config_version=5

          [application]

          config/name="shader-gate-test"
          EOF
          cat > shader_gate_test/test_shader_transmittance_mix.gdshader <<'EOF'
          shader_type canvas_item;
          render_mode unshaded, blend_transmittance_mix;
          void fragment() { COLOR = vec4(0.0); }
          EOF
          cat > shader_gate_test/test_shader_transmittance_add.gdshader <<'EOF'
          shader_type canvas_item;
          render_mode unshaded, blend_transmittance_add;
          void fragment() { COLOR = vec4(0.0); }
          EOF
          # --import scans assets and triggers shader compile; --headless
          # avoids GPU init. Use || true so editor's exit code (which can be
          # non-zero on import-only paths) doesn't mask grep result.
          ./bin/godot.windows.editor.x86_64.exe --headless --path shader_gate_test --import 2>&1 | tee shader_gate.log || true
          if grep -qi "Invalid render mode\|Invalid stencil mode\|Shader compilation failed" shader_gate.log; then
            echo "::error::Shader compile gate FAILED — see shader_gate.log"
            grep -iE "Invalid render mode|Invalid stencil mode|Shader compilation failed|SHADER ERROR" shader_gate.log || true
            exit 1
          fi
          echo "Shader compile gate PASS"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: komm64-godot-windows-*
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
